<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HELIX — Assistente Virtuale IE Health Accenture</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #080810;
      --surface:     #0f0f1c;
      --surface2:    #181828;
      --purple:      #A100FF;
      --purple-dim:  #7000b3;
      --cyan:        #00C9FF;
      --green:       #22c55e;
      --text:        #F0F0F0;
      --text-muted:  #888;
      --bubble-user: #1a1a2e;
      --bubble-bot:  #10101e;
      --border:      rgba(161,0,255,0.18);
      --radius:      14px;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: 64px;
      background: rgba(8,8,16,0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
    }

    .logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
    }
    .logo-mark {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.45rem; font-weight: 700;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .logo-sub {
      font-size: 0.68rem; color: var(--text-muted);
      border-left: 1px solid var(--border);
      padding-left: 10px; line-height: 1.4;
    }

    /* ── Ambito badge in header ── */
    #ambito-badge {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 14px 6px 10px;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }
    #ambito-badge:hover { border-color: var(--purple); background: var(--surface2); }
    #ambito-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 0 8px var(--purple);
      flex-shrink: 0;
    }
    #ambito-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.9rem; font-weight: 600;
      color: var(--text);
      max-width: 200px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #ambito-change {
      font-size: 0.68rem; color: var(--text-muted);
      margin-left: 2px;
    }

    .header-right {
      display: flex; align-items: center; gap: 12px;
    }
    .status-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem; color: var(--text-muted);
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .docs-link {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px;
      color: var(--text-muted); font-size: 0.78rem; text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .docs-link:hover { border-color: var(--purple); color: var(--text); }

    /* ── CHAT AREA ── */
    #chat-area {
      position: fixed;
      top: 64px; bottom: 80px; left: 0; right: 0;
      overflow-y: auto;
      padding: 24px 16px;
      scroll-behavior: smooth;
    }
    #chat-area::-webkit-scrollbar { width: 4px; }
    #chat-area::-webkit-scrollbar-track { background: transparent; }
    #chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .messages { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    .msg { display: flex; align-items: flex-end; gap: 10px; animation: slide-in 0.25s ease; }
    @keyframes slide-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.82rem; font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
    }
    .avatar.bot  { background: linear-gradient(135deg, var(--purple), var(--cyan)); color: #fff; }
    .avatar.user { background: var(--surface2); color: var(--cyan); border: 1px solid var(--border); }

    .bubble {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 0.92rem;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .msg.bot  .bubble { background: var(--bubble-bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.user .bubble { background: var(--bubble-user); border: 1px solid rgba(0,201,255,0.15); border-bottom-right-radius: 4px; white-space: pre-wrap; }

    .bubble p  { margin: 0 0 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h2 { font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--cyan); margin: 10px 0 6px; }
    .bubble h3 { font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 600; color: var(--cyan); margin: 8px 0 4px; }
    .bubble h4 { font-family: 'Rajdhani', sans-serif; font-size: 0.92rem; font-weight: 600; color: var(--text-muted); margin: 8px 0 4px; }
    .bubble strong { color: var(--cyan); font-weight: 600; }
    .bubble em { color: #d0d0e8; font-style: italic; }
    .bubble a  { color: var(--purple); text-decoration: underline; word-break: break-all; }
    .bubble a:hover { color: var(--cyan); }
    .bubble code {
      background: rgba(161,0,255,0.12); border: 1px solid rgba(161,0,255,0.25);
      border-radius: 4px; padding: 1px 5px;
      font-family: 'Courier New', monospace; font-size: 0.85em; color: var(--cyan);
    }
    .bubble pre {
      background: rgba(0,0,0,0.4); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0;
    }
    .bubble pre code { background: none; border: none; padding: 0; font-size: 0.83rem; color: #c9d1d9; }
    .bubble ul, .bubble ol { padding-left: 20px; margin: 4px 0 8px; }
    .bubble li { margin: 3px 0; line-height: 1.55; }
    .bubble li::marker { color: var(--purple); }
    .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    .bubble .source-footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-muted); }
    .bubble .source-footer strong { color: var(--text-muted); }
    .bubble .source-footer ul { margin: 4px 0 4px 16px; }
    .bubble .source-footer li::marker { color: var(--text-muted); }

    .bubble .doc-links { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .bubble .doc-links-label { font-size: 0.74rem; color: var(--text-muted); flex-shrink: 0; }
    .bubble .doc-link-btn {
      display: inline-block; padding: 3px 10px;
      background: rgba(161,0,255,0.1); border: 1px solid rgba(161,0,255,0.28);
      border-radius: 20px; font-size: 0.72rem; color: var(--cyan);
      text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 240px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .bubble .doc-link-btn:hover { background: rgba(161,0,255,0.22); border-color: var(--purple); color: var(--text); }

    /* ── TYPING INDICATOR ── */
    .typing-bubble { display: flex; align-items: center; gap: 5px; padding: 12px 18px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--purple); animation: bounce 1.2s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-7px); opacity: 1; } }

    /* ── INPUT BAR ── */
    #input-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
      background: rgba(8,8,16,0.97); backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 10px;
    }

    #input-wrap {
      flex: 1; display: flex; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 30px; padding: 0 16px;
      transition: border-color 0.2s;
    }
    #input-wrap:focus-within { border-color: var(--purple); }

    #msg-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: 'DM Sans', sans-serif;
      font-size: 0.93rem; padding: 12px 0;
    }
    #msg-input::placeholder { color: var(--text-muted); }
    #msg-input:disabled { opacity: 0.5; cursor: not-allowed; }

    .icon-btn {
      background: none; border: none; cursor: pointer; color: var(--text-muted);
      padding: 6px; border-radius: 50%;
      transition: color 0.2s, background 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { color: var(--cyan); background: rgba(0,201,255,0.08); }
    .icon-btn.recording { color: var(--purple); animation: pulse-rec 1s ease-in-out infinite; }
    @keyframes pulse-rec { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    #send-btn {
      width: 44px; height: 44px; background: var(--purple);
      border: none; border-radius: 50%; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.1s; flex-shrink: 0;
    }
    #send-btn:hover  { background: var(--purple-dim); transform: scale(1.05); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── AMBITO PICKER OVERLAY ── */
    #picker-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      align-items: center; justify-content: center;
      padding: 24px;
    }
    #picker-overlay.active { display: flex; }

    #picker-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%; max-width: 680px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 32px;
      animation: modal-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modal-in { from { opacity: 0; transform: scale(0.92) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    .picker-header { margin-bottom: 8px; }
    .picker-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.6rem; font-weight: 700;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .picker-subtitle { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 24px; }

    .ambiti-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .ambito-card {
      background: var(--surface2);
      border: 2px solid transparent;
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }
    .ambito-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--card-color, var(--purple));
      border-radius: 2px 2px 0 0;
    }
    .ambito-card:hover {
      border-color: var(--card-color, var(--purple));
      background: rgba(161,0,255,0.04);
      transform: translateY(-2px);
    }
    .ambito-card.selected {
      border-color: var(--card-color, var(--purple));
      background: rgba(161,0,255,0.07);
    }

    .card-icon { font-size: 1.8rem; margin-bottom: 10px; }
    .card-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem; font-weight: 700;
      color: var(--text); margin-bottom: 4px;
    }
    .card-desc { font-size: 0.78rem; color: var(--text-muted); line-height: 1.5; }
    .card-docs {
      margin-top: 8px; font-size: 0.72rem;
      color: var(--cyan); opacity: 0.8;
    }

    .picker-empty {
      text-align: center; padding: 32px 16px;
      color: var(--text-muted); font-size: 0.9rem;
    }
    .picker-empty .empty-icon { font-size: 2.5rem; margin-bottom: 12px; display: block; }

    .picker-confirm {
      width: 100%;
      background: var(--purple);
      border: none; border-radius: 10px;
      padding: 13px;
      color: #fff; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .picker-confirm:hover  { background: var(--purple-dim); }
    .picker-confirm:active { transform: scale(0.98); }
    .picker-confirm:disabled { opacity: 0.35; cursor: not-allowed; }

    .picker-manage-link {
      text-align: center; margin-top: 14px;
      font-size: 0.78rem; color: var(--text-muted);
    }
    .picker-manage-link a { color: var(--cyan); text-decoration: none; }
    .picker-manage-link a:hover { text-decoration: underline; }

    /* ── USER CHIP ── */
    .user-chip {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.76rem; color: var(--text-muted);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 12px;
    }
    .logout-btn {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px;
      color: var(--text-muted); font-size: 0.78rem; cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .logout-btn:hover { border-color: var(--purple); color: var(--text); }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .logo-sub { display: none; }
      #ambito-label { max-width: 110px; }
      .bubble { max-width: 88%; }
      .ambiti-grid { grid-template-columns: 1fr; }
    }
  </style>
  <script src="auth.js"></script>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <span class="logo-mark">HELIX</span>
    <span class="logo-sub">IE Health Delivery<br>Powered by Accenture</span>
  </div>

  <div id="ambito-badge" onclick="openPicker()" title="Cambia ambito">
    <span id="ambito-dot"></span>
    <span id="ambito-label">Seleziona un ambito…</span>
    <span id="ambito-change">▾</span>
  </div>

  <div class="header-right">
    <span id="user-chip" class="user-chip" style="display:none"></span>
    <a id="admin-link" href="admin.html" class="docs-link" style="display:none">⚙️ Admin</a>
    <a href="docs.html" class="docs-link">📁 Documenti</a>
    <button class="logout-btn" onclick="helixLogout()">Esci</button>
    <div class="status-badge">
      <span class="status-dot"></span>Online
    </div>
  </div>
</header>

<!-- CHAT -->
<div id="chat-area">
  <div class="messages" id="messages"></div>
</div>

<!-- INPUT BAR -->
<div id="input-bar">
  <div id="input-wrap">
    <input id="msg-input" type="text" placeholder="Seleziona un ambito per iniziare…" autocomplete="off" disabled />
    <button class="icon-btn" id="voice-btn" title="Input vocale" aria-label="Attiva microfono">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8"  y1="23" x2="16" y2="23"/>
      </svg>
    </button>
  </div>
  <button id="send-btn" disabled aria-label="Invia">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<!-- AMBITO PICKER OVERLAY -->
<div id="picker-overlay">
  <div id="picker-modal">
    <div class="picker-header">
      <div class="picker-title">Scegli il tuo Ambito</div>
      <p class="picker-subtitle">Seleziona l'area di competenza. HELIX risponderà solo sulla documentazione dell'ambito scelto.</p>
    </div>
    <div class="ambiti-grid" id="picker-grid">
      <!-- Cards injected by JS -->
    </div>
    <button class="picker-confirm" id="picker-confirm" disabled onclick="confirmAmbito()">
      Inizia la conversazione →
    </button>
    <button id="set-default-btn" onclick="setDefaultAmbito()"
      style="display:none;width:100%;margin-top:8px;background:transparent;border:1px solid var(--border);
             border-radius:10px;padding:10px;color:var(--text-muted);font-family:'DM Sans',sans-serif;
             font-size:0.85rem;cursor:pointer;transition:border-color 0.2s,color 0.2s">
      ⭐ Imposta come ambito predefinito
    </button>
    <div class="picker-manage-link">
      Vuoi aggiungere un ambito o caricare documenti?
      <a href="docs.html">Vai alla Gestione Documenti</a>
    </div>
  </div>
</div>

<script>
  const SESSION_ID = 'session_' + Math.random().toString(36).slice(2);

  let currentAmbito   = null; // { slug, name, color }
  let selectedInPicker = null;
  let allAmbiti = [];

  const messagesEl  = document.getElementById('messages');
  const inputEl     = document.getElementById('msg-input');
  const sendBtn     = document.getElementById('send-btn');
  const voiceBtn    = document.getElementById('voice-btn');
  const ambitoBadge = document.getElementById('ambito-badge');
  const ambitoDot   = document.getElementById('ambito-dot');
  const ambitoLabel = document.getElementById('ambito-label');

  // ── Ambito picker ────────────────────────────────────────────────────

  function openPicker() {
    loadAmbiti().then(() => {
      selectedInPicker = currentAmbito ? currentAmbito.slug : null;
      renderPickerGrid();
      document.getElementById('picker-overlay').classList.add('active');
    });
  }

  function closePicker() {
    document.getElementById('picker-overlay').classList.remove('active');
  }

  async function loadAmbiti() {
    try {
      const res  = await fetch(`${API_BASE}/ambiti`, { headers: authHeaders() });
      const data = await res.json();
      allAmbiti  = data.ambiti || [];
    } catch {
      allAmbiti = [];
    }
  }

  function renderPickerGrid() {
    const grid    = document.getElementById('picker-grid');
    const confirm = document.getElementById('picker-confirm');

    if (!allAmbiti.length) {
      grid.innerHTML = `
        <div class="picker-empty" style="grid-column:1/-1">
          <span class="empty-icon">🧩</span>
          <p>Nessun ambito configurato.<br>
          Creane uno dalla <a href="docs.html" style="color:var(--cyan)">Gestione Documenti</a>.</p>
        </div>`;
      confirm.disabled = true;
      return;
    }

    const userDefault = (getUser() || {}).default_ambito;
    grid.innerHTML = allAmbiti.map(a => {
      const isSelected = selectedInPicker === a.slug;
      const isDefault  = a.slug === userDefault;
      const icon  = a.icon || '📂';
      return `
        <div class="ambito-card ${isSelected ? 'selected' : ''}"
             style="--card-color: ${a.color || 'var(--purple)'}"
             onclick="selectAmbito('${a.slug}')">
          <div class="card-icon">${icon}</div>
          <div class="card-name">${escHtml(a.name)}${isDefault ? ' <span title="Ambito predefinito" style="font-size:0.8rem">⭐</span>' : ''}</div>
          <div class="card-desc">${escHtml(a.description || '')}</div>
        </div>`;
    }).join('');

    confirm.disabled = !selectedInPicker;

    const defBtn = document.getElementById('set-default-btn');
    if (defBtn) {
      defBtn.style.display = selectedInPicker ? 'block' : 'none';
      defBtn.disabled = selectedInPicker === userDefault;
      defBtn.textContent = selectedInPicker === userDefault
        ? '✓ Già ambito predefinito'
        : '⭐ Imposta come ambito predefinito';
    }
  }

  function selectAmbito(slug) {
    selectedInPicker = slug;
    document.querySelectorAll('.ambito-card').forEach(card => {
      card.classList.toggle('selected', card.querySelector('.card-name') &&
        allAmbiti.find(a => a.slug === slug) &&
        card.style.getPropertyValue('--card-color') === (allAmbiti.find(a => a.slug === slug).color || 'var(--purple)') &&
        card.querySelector('.card-name').textContent === allAmbiti.find(a => a.slug === slug).name
      );
    });
    // Simpler re-render
    renderPickerGrid();
    document.getElementById('picker-confirm').disabled = false;
  }

  function confirmAmbito() {
    if (!selectedInPicker) return;
    const ambito = allAmbiti.find(a => a.slug === selectedInPicker);
    if (!ambito) return;

    const switching = currentAmbito && currentAmbito.slug !== ambito.slug;
    currentAmbito = ambito;

    // Update badge
    ambitoDot.style.background = ambito.color || 'var(--purple)';
    ambitoDot.style.boxShadow  = `0 0 8px ${ambito.color || 'var(--purple)'}`;
    ambitoLabel.textContent     = ambito.name;
    document.getElementById('ambito-change').textContent = '▾';

    // Enable chat
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.placeholder = `Chiedimi qualcosa su "${ambito.name}"…`;
    inputEl.focus();

    closePicker();

    if (switching) {
      messagesEl.innerHTML = '';
    }

    if (!messagesEl.children.length) {
      appendMessage('bot',
        `Ciao! Sono **HELIX**, l'assistente virtuale del gruppo **IE Health Accenture**.\n\n` +
        `Hai selezionato l'ambito **${ambito.name}**${ambito.description ? ` — ${ambito.description}` : ''}.\n\n` +
        `Posso rispondere alle tue domande basandomi sulla documentazione caricata per questo ambito.\n\n` +
        `Come posso aiutarti?`
      );
    }
  }

  // ── Render helpers ───────────────────────────────────────────────────

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function inlineMd(text) {
    text = escHtml(text);
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    text = text.split(/(<a\b[^>]*>[\s\S]*?<\/a>)/).map((seg, i) => {
      if (i % 2 === 1) return seg;
      return seg.replace(/https?:\/\/[^\s<>"'&)]+/g, url => {
        const clean = url.replace(/[.,;:!?]+$/, '');
        const trail = url.slice(clean.length);
        return `<a href="${clean}" target="_blank" rel="noopener">${clean}</a>${trail}`;
      });
    }).join('');
    return text;
  }

  function mdBlock(text) {
    const lines = text.split('\n');
    let html = '', inUl = false, inOl = false, paraLines = [];

    const flushPara = () => {
      if (!paraLines.length) return;
      html += '<p>' + paraLines.map(inlineMd).join('<br>') + '</p>';
      paraLines = [];
    };
    const closeUl = () => { if (inUl) { html += '</ul>'; inUl = false; } };
    const closeOl = () => { if (inOl) { html += '</ol>'; inOl = false; } };

    for (const line of lines) {
      if (/^### /.test(line)) { flushPara(); closeUl(); closeOl(); html += `<h4>${inlineMd(line.slice(4))}</h4>`; continue; }
      if (/^## /.test(line))  { flushPara(); closeUl(); closeOl(); html += `<h3>${inlineMd(line.slice(3))}</h3>`; continue; }
      if (/^# /.test(line))   { flushPara(); closeUl(); closeOl(); html += `<h2>${inlineMd(line.slice(2))}</h2>`; continue; }
      if (/^[-*] /.test(line))  { flushPara(); closeOl(); if (!inUl) { html += '<ul>'; inUl = true; } html += `<li>${inlineMd(line.slice(2))}</li>`; continue; }
      if (/^\d+\. /.test(line)) { flushPara(); closeUl(); if (!inOl) { html += '<ol>'; inOl = true; } html += `<li>${inlineMd(line.replace(/^\d+\. /, ''))}</li>`; continue; }
      if (line.trim() === '') { flushPara(); closeUl(); closeOl(); continue; }
      closeUl(); closeOl();
      paraLines.push(line);
    }
    flushPara(); closeUl(); closeOl();
    return html;
  }

  function renderMarkdown(raw) {
    const m = raw.match(/\n---\n/);
    if (!m) return mdBlock(raw);
    const idx    = raw.indexOf('\n---\n');
    const body   = raw.slice(0, idx);
    const footer = raw.slice(idx + 5);
    return mdBlock(body) + `<div class="source-footer">${mdBlock(footer)}</div>`;
  }

  function appendMessage(role, text, sources = [], ambito = null) {
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'bot' ? 'HX' : 'ME';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderMarkdown(text);

    if (role === 'bot' && sources && sources.length > 0) {
      const linksDiv = document.createElement('div');
      linksDiv.className = 'doc-links';
      const label = document.createElement('span');
      label.className = 'doc-links-label';
      label.textContent = '📎 Apri fonte:';
      linksDiv.appendChild(label);
      sources.forEach(filename => {
        const a = document.createElement('a');
        const slug = (ambito && ambito.slug) ? ambito.slug : (currentAmbito ? currentAmbito.slug : '');
        a.href = `${API_BASE}/docs/file?filename=${encodeURIComponent(filename)}&ambito=${encodeURIComponent(slug)}`;
        a.target = '_blank';
        a.rel = 'noopener';
        a.className = 'doc-link-btn';
        a.title = filename;
        a.textContent = filename;
        linksDiv.appendChild(a);
      });
      bubble.appendChild(linksDiv);
    }

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollToBottom();
    return bubble;
  }

  function showTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.id = 'typing-indicator';
    const avatar = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.textContent = 'HX';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing-bubble';
    bubble.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    const area = document.getElementById('chat-area');
    area.scrollTop = area.scrollHeight;
  }

  // ── Send message ─────────────────────────────────────────────────────

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !currentAmbito) return;

    inputEl.value = '';
    appendMessage('user', text);
    showTyping();
    sendBtn.disabled = true;

    const ambitoSnapshot = { ...currentAmbito };

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ message: text, session_id: SESSION_ID, ambito: ambitoSnapshot.slug }),
      });

      if (!res.ok) {
        let detail = `HTTP ${res.status}`;
        try { const errBody = await res.json(); detail = errBody.detail || detail; } catch {}
        throw new Error(detail);
      }
      const data = await res.json();
      removeTyping();
      appendMessage('bot', data.response, data.sources || [], ambitoSnapshot);
    } catch (err) {
      removeTyping();
      appendMessage('bot',
        `⚠️ Errore: ${err.message}\n\n` +
        '---\n📚 **Fonti utilizzate:**\nRisposta generata senza riferimento a documentazione specifica.'
      );
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // Close picker clicking outside modal
  document.getElementById('picker-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('picker-overlay') && currentAmbito) closePicker();
  });

  // ── Voice input ──────────────────────────────────────────────────────

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.lang = 'it-IT';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    let isRecording = false;

    voiceBtn.addEventListener('click', () => {
      if (!currentAmbito) return;
      isRecording ? recognition.stop() : recognition.start();
    });
    recognition.onstart  = () => { isRecording = true;  voiceBtn.classList.add('recording');    voiceBtn.title = 'Registrazione… (clicca per fermare)'; };
    recognition.onresult = e  => { inputEl.value = e.results[0][0].transcript; inputEl.focus(); };
    recognition.onend    = () => { isRecording = false; voiceBtn.classList.remove('recording'); voiceBtn.title = 'Input vocale'; };
    recognition.onerror  = e  => { isRecording = false; voiceBtn.classList.remove('recording'); console.warn('Speech error:', e.error); };
  } else {
    voiceBtn.title = 'Input vocale non supportato (usa Chrome)';
    voiceBtn.style.opacity = '0.35';
    voiceBtn.style.cursor  = 'not-allowed';
  }

  // ── User info ─────────────────────────────────────────────────────────

  function renderUserInfo(user) {
    const chip = document.getElementById('user-chip');
    chip.textContent = '👤 ' + user.username;
    chip.style.display = 'flex';
    if (user.role === 'admin') {
      document.getElementById('admin-link').style.display = 'flex';
    }
  }

  async function setDefaultAmbito() {
    if (!selectedInPicker) return;
    try {
      const res = await fetch(`${API_BASE}/auth/me`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ default_ambito: selectedInPicker }),
      });
      if (!res.ok) throw new Error();
      const updatedUser = await res.json();
      localStorage.setItem(USER_KEY, JSON.stringify(updatedUser));
      renderPickerGrid();
    } catch {
      alert("Errore durante il salvataggio dell'ambito predefinito.");
    }
  }

  // ── Init ─────────────────────────────────────────────────────────────

  window.addEventListener('load', async () => {
    const user = await checkAuth();
    if (!user) return;
    renderUserInfo(user);

    if (user.default_ambito) {
      await loadAmbiti();
      const ambito = allAmbiti.find(a => a.slug === user.default_ambito);
      if (ambito) {
        selectedInPicker = ambito.slug;
        confirmAmbito();
        return;
      }
    }
    openPicker();
  });
</script>
