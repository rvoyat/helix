<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HELIX — Gestione Documenti</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="helix-brand.css" />
  <script>(function(){var t=localStorage.getItem('helix_theme');if(t==='light')document.documentElement.classList.add('light');})()</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #080810;
      --surface:    #0f0f1c;
      --surface2:   #181828;
      --purple:     #A100FF;
      --purple-dim: #7000b3;
      --cyan:       #00C9FF;
      --green:      #22c55e;
      --red:        #ef4444;
      --orange:     #f97316;
      --text:       #F0F0F0;
      --muted:      #888;
      --border:     rgba(161,0,255,0.18);
      --radius:     14px;
    }

    html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      height: 64px;
      background: rgba(8,8,16,0.95); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-mark {
      font-family: 'Rajdhani', sans-serif; font-size: 1.35rem; font-weight: 700;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .logo-sub { font-size: 0.68rem; color: var(--muted); border-left: 1px solid var(--border); padding-left: 10px; line-height: 1.4; }
    .page-tag { font-family: 'Rajdhani', sans-serif; font-size: 0.8rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--cyan); }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 14px;
      color: var(--muted); font-size: 0.82rem; cursor: pointer;
      text-decoration: none; transition: border-color 0.2s, color 0.2s;
    }
    .back-btn:hover { border-color: var(--purple); color: var(--text); }

    /* ── LAYOUT ── */
    .page-layout {
      display: flex; min-height: calc(100vh - 64px);
    }

    /* ── SIDEBAR (ambiti list) ── */
    .sidebar {
      width: 260px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 0;
      position: sticky; top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .sidebar-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.7rem; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted); padding: 0 20px 12px;
      border-bottom: 1px solid var(--border); margin-bottom: 8px;
    }

    .ambito-tab {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 20px; cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
    }
    .ambito-tab:hover { background: rgba(161,0,255,0.05); }
    .ambito-tab.active {
      background: rgba(161,0,255,0.1);
      border-left-color: var(--tab-color, var(--purple));
    }
    .tab-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--tab-color, var(--purple));
      flex-shrink: 0;
    }
    .tab-name { font-size: 0.88rem; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .tab-count { font-size: 0.72rem; color: var(--muted); flex-shrink: 0; }

    .sidebar-add-btn {
      margin: 12px 20px 0;
      display: flex; align-items: center; gap: 7px;
      background: transparent; border: 1px dashed rgba(161,0,255,0.35);
      border-radius: 8px; padding: 9px 14px;
      color: var(--muted); font-size: 0.82rem; cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      width: calc(100% - 40px);
    }
    .sidebar-add-btn:hover { border-color: var(--purple); color: var(--text); background: rgba(161,0,255,0.05); }

    /* ── MAIN CONTENT ── */
    .main-content { flex: 1; padding: 32px 28px 60px; min-width: 0; }

    .no-ambito-placeholder {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 50vh; color: var(--muted); text-align: center;
    }
    .no-ambito-placeholder .big-icon { font-size: 3rem; margin-bottom: 16px; }
    .no-ambito-placeholder h2 { font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; color: var(--text); margin-bottom: 8px; }
    .no-ambito-placeholder p { font-size: 0.88rem; }

    /* ── SECTION HEADER ── */
    .section-header-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .section-heading {
      font-family: 'Rajdhani', sans-serif; font-size: 1.6rem; font-weight: 700;
    }
    .section-heading .ambito-name-color {
      background: linear-gradient(135deg, var(--active-color, var(--purple)), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .section-desc { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }

    .header-actions { display: flex; gap: 8px; align-items: center; }

    .reindex-btn {
      display: flex; align-items: center; gap: 7px;
      background: transparent; border: 1px solid rgba(249,115,22,0.4);
      border-radius: 8px; padding: 7px 14px;
      color: var(--orange); font-size: 0.82rem; font-weight: 500; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .reindex-btn:hover { background: rgba(249,115,22,0.08); border-color: var(--orange); }

    .delete-ambito-btn {
      display: flex; align-items: center; gap: 7px;
      background: transparent; border: 1px solid rgba(239,68,68,0.35);
      border-radius: 8px; padding: 7px 14px;
      color: var(--red); font-size: 0.82rem; font-weight: 500; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .delete-ambito-btn:hover { background: rgba(239,68,68,0.08); border-color: var(--red); }

    /* ── STATS BAR ── */
    .stats-bar { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .stat-val { font-family: 'Rajdhani', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--cyan); }
    .stat-lbl { color: var(--muted); font-size: 0.78rem; }

    /* ── UPLOAD ZONE ── */
    .upload-zone {
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 32px; text-align: center; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 24px; position: relative;
    }
    .upload-zone:hover, .upload-zone.drag-over { border-color: var(--purple); background: rgba(161,0,255,0.04); }
    .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-icon { font-size: 2rem; margin-bottom: 8px; }
    .upload-zone h3 { font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
    .upload-zone p { font-size: 0.8rem; color: var(--muted); }
    .pill-tag { display: inline-block; margin-top: 8px; background: rgba(161,0,255,0.15); border: 1px solid var(--border); border-radius: 20px; padding: 3px 12px; font-size: 0.74rem; color: var(--cyan); }

    /* ── SECTION TITLE ── */
    .list-title { font-family: 'Rajdhani', sans-serif; font-size: 0.72rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

    /* ── DOC LIST ── */
    #doc-list { display: flex; flex-direction: column; gap: 10px; }

    .doc-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 20px;
      display: flex; align-items: center; gap: 16px;
      transition: border-color 0.2s; animation: fadein 0.2s ease;
    }
    @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
    .doc-card:hover { border-color: rgba(161,0,255,0.35); }

    .doc-icon { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--purple-dim), var(--purple)); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
    .doc-info { flex: 1; min-width: 0; }
    .doc-name { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
    .doc-meta { font-size: 0.75rem; color: var(--muted); display: flex; gap: 12px; }
    .doc-meta span { display: flex; align-items: center; gap: 4px; }
    .doc-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .action-btn { border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 0.78rem; font-weight: 500; cursor: pointer; background: transparent; transition: background 0.15s, border-color 0.15s, color 0.15s; display: flex; align-items: center; gap: 5px; position: relative; }
    .action-btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .btn-replace { color: var(--cyan); }
    .btn-replace:hover { background: rgba(0,201,255,0.08); border-color: var(--cyan); }
    .btn-delete  { color: var(--red); }
    .btn-delete:hover  { background: rgba(239,68,68,0.08); border-color: var(--red); }

    .empty-state { text-align: center; padding: 40px 24px; color: var(--muted); font-size: 0.9rem; }
    .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }

    .spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 48px; }
    .spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--purple); animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── TOAST ── */
    #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; pointer-events: none; }
    .toast { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; font-size: 0.86rem; display: flex; align-items: center; gap: 10px; max-width: 340px; animation: toast-in 0.25s ease; pointer-events: all; }
    .toast.success { border-color: rgba(34,197,94,0.4); }
    .toast.error   { border-color: rgba(239,68,68,0.4); }
    .toast.info    { border-color: rgba(0,201,255,0.4); }
    .toast-icon { font-size: 1rem; flex-shrink: 0; }
    @keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .toast.removing { animation: toast-out 0.25s ease forwards; }
    @keyframes toast-out { to { opacity: 0; transform: translateX(20px); height: 0; padding: 0; margin: 0; } }

    /* ── OVERLAY ── */
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 500; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
    #overlay.active { display: flex; }
    #overlay .spinner { width: 48px; height: 48px; border-width: 4px; }
    #overlay p { color: var(--muted); font-size: 0.9rem; }

    /* ── MODAL (create ambito) ── */
    #modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 600;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 24px;
    }
    #modal-overlay.active { display: flex; }
    #modal-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; width: 100%; max-width: 480px;
      padding: 32px; animation: modal-in 0.25s ease;
    }
    @keyframes modal-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
    .modal-title { font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; color: var(--text); }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    .form-label .required { color: var(--red); margin-left: 3px; }
    .form-input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px;
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.88rem;
      outline: none; transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--purple); }
    .form-hint { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }

    .color-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-swatch {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: border-color 0.15s, transform 0.1s;
    }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.chosen { border-color: #fff; }

    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn-primary {
      flex: 1; background: var(--purple); border: none; border-radius: 8px;
      padding: 11px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
      font-weight: 500; cursor: pointer; transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--purple-dim); }
    .btn-secondary {
      background: transparent; border: 1px solid var(--border); border-radius: 8px;
      padding: 11px 18px; color: var(--muted); font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; cursor: pointer; transition: border-color 0.2s, color 0.2s;
    }
    .btn-secondary:hover { border-color: var(--purple); color: var(--text); }

    .user-chip {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.76rem; color: var(--muted);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 12px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .sidebar { display: none; }
      .page-tag { display: none; }
    }
  </style>
  <script src="auth.js"></script>
  <script src="helix-brand.js"></script>
</head>
<body>

<header>
  <div class="logo"></div>
  <span class="page-tag">Gestione Documenti</span>
  <div class="header-right" style="display:flex;align-items:center;gap:8px">
    <span id="user-chip" class="user-chip" style="display:none"></span>
    <a id="admin-link" href="admin.html" class="back-btn" style="display:none">⚙️ Admin</a>
    <button class="back-btn" style="cursor:pointer;font-family:inherit" onclick="helixLogout()">Esci</button>
    <a href="index.html" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Chatbot
    </a>
  </div>
</header>

<div class="page-layout">

  <!-- SIDEBAR: Ambiti list -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Ambiti configurati</div>
    <div id="sidebar-ambiti">
      <!-- Injected by JS -->
    </div>
    <button class="sidebar-add-btn" onclick="openCreateModal()">
      ＋ Aggiungi ambito
    </button>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content" id="main-content">
    <!-- Content injected by JS based on selected ambito -->
    <div class="no-ambito-placeholder" id="no-ambito-msg">
      <div class="big-icon">🧩</div>
      <h2>Seleziona un ambito</h2>
      <p>Scegli un ambito dalla sidebar per gestire i suoi documenti,<br>o creane uno nuovo.</p>
    </div>
    <div id="ambito-content" style="display:none">
      <!-- filled when an ambito is selected -->
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Loading overlay -->
<div id="overlay">
  <div class="spinner"></div>
  <p id="overlay-msg">Elaborazione in corso…</p>
</div>

<!-- Create Ambito Modal -->
<div id="modal-overlay">
  <div id="modal-box">
    <div class="modal-title">✦ Nuovo Ambito</div>

    <div class="form-group">
      <label class="form-label">Nome ambito <span class="required">*</span></label>
      <input class="form-input" id="f-name" type="text" placeholder="es. Project Management" maxlength="60" />
    </div>

    <div class="form-group">
      <label class="form-label">Slug (ID univoco) <span class="required">*</span></label>
      <input class="form-input" id="f-slug" type="text" placeholder="es. project-management" maxlength="40" />
      <div class="form-hint">Solo lettere minuscole, numeri e trattini. Auto-generato dal nome.</div>
    </div>

    <div class="form-group">
      <label class="form-label">Descrizione</label>
      <input class="form-input" id="f-desc" type="text" placeholder="es. Metodologie e framework per la gestione progetti" maxlength="120" />
    </div>

    <div class="form-group">
      <label class="form-label">Colore</label>
      <div class="color-row" id="color-row">
        <!-- swatches injected by JS -->
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Icona (emoji)</label>
      <input class="form-input" id="f-icon" type="text" placeholder="📁" maxlength="4" style="width:80px;text-align:center;font-size:1.3rem;" />
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeCreateModal()">Annulla</button>
      <button class="btn-primary" onclick="createAmbito()">Crea Ambito →</button>
    </div>
  </div>
</div>

<script>
  let allAmbiti    = [];
  let activeSlug   = null;
  let chosenColor  = '#A100FF';

  const COLORS = ['#A100FF', '#00C9FF', '#22c55e', '#f97316', '#ec4899', '#eab308', '#14b8a6', '#6366f1'];
  const ICONS  = ['📁', '🏥', '📊', '🔬', '⚙️', '📋', '🎯', '🔐', '🌐', '💼'];

  // ── Utilities ────────────────────────────────────────────────────────

  function fmtSize(bytes) {
    if (bytes < 1024)        return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function slugify(str) {
    return str.toLowerCase().trim()
      .replace(/[\s_]+/g, '-')
      .replace(/[^a-z0-9-]/g, '')
      .replace(/-+/g, '-')
      .slice(0, 40);
  }

  function toast(msg, type = 'info') {
    const icons = { success: '✅', error: '❌', info: 'ℹ️' };
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${msg}</span>`;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => { el.classList.add('removing'); setTimeout(() => el.remove(), 260); }, 3500);
  }

  function showOverlay(msg = 'Elaborazione in corso…') {
    document.getElementById('overlay-msg').textContent = msg;
    document.getElementById('overlay').classList.add('active');
  }
  function hideOverlay() { document.getElementById('overlay').classList.remove('active'); }

  // ── Load ambiti ──────────────────────────────────────────────────────

  async function loadAmbiti() {
    try {
      const res  = await fetch(`${API_BASE}/ambiti`, { headers: authHeaders() });
      const data = await res.json();
      allAmbiti  = data.ambiti || [];
    } catch {
      allAmbiti = [];
      toast('Impossibile connettersi al backend.', 'error');
    }
    renderSidebar();
    if (activeSlug) loadAmbitoContent(activeSlug);
  }

  // ── Sidebar rendering ────────────────────────────────────────────────

  function renderSidebar() {
    const el = document.getElementById('sidebar-ambiti');
    if (!allAmbiti.length) {
      el.innerHTML = `<div style="padding:16px 20px;font-size:0.8rem;color:var(--muted)">Nessun ambito creato.</div>`;
      return;
    }
    el.innerHTML = allAmbiti.map(a => `
      <div class="ambito-tab ${a.slug === activeSlug ? 'active' : ''}"
           style="--tab-color: ${a.color || 'var(--purple)'}"
           onclick="selectAmbito('${a.slug}')">
        <span class="tab-dot" style="background:${a.color || 'var(--purple)'}"></span>
        <span class="tab-name" title="${escHtml(a.name)}">${escHtml(a.icon || '📂')} ${escHtml(a.name)}</span>
      </div>
    `).join('');
  }

  function selectAmbito(slug) {
    activeSlug = slug;
    renderSidebar();
    loadAmbitoContent(slug);
  }

  // ── Ambito content panel ─────────────────────────────────────────────

  async function loadAmbitoContent(slug) {
    const ambito = allAmbiti.find(a => a.slug === slug);
    if (!ambito) return;

    document.getElementById('no-ambito-msg').style.display   = 'none';
    document.getElementById('ambito-content').style.display  = 'block';

    document.getElementById('ambito-content').innerHTML = `<div class="spinner-wrap"><div class="spinner"></div></div>`;

    let docs = [];
    try {
      const res  = await fetch(`${API_BASE}/docs-list?ambito=${encodeURIComponent(slug)}`, { headers: authHeaders() });
      const data = await res.json();
      docs       = data.documents || [];
    } catch {
      toast('Errore caricamento documenti.', 'error');
    }

    const totalPages = docs.reduce((s, d) => s + d.pages, 0);
    const totalSize  = docs.reduce((s, d) => s + d.size,  0);

    document.getElementById('ambito-content').innerHTML = `
      <div class="section-header-row">
        <div>
          <h1 class="section-heading">
            ${escHtml(ambito.icon || '📂')} <span class="ambito-name-color" style="--active-color:${ambito.color || 'var(--purple)'}">${escHtml(ambito.name)}</span>
          </h1>
          ${ambito.description ? `<p class="section-desc">${escHtml(ambito.description)}</p>` : ''}
        </div>
        <div class="header-actions">
          <button class="reindex-btn" onclick="reindexAmbito('${slug}')">🔁 Reindicizza</button>
          <button class="delete-ambito-btn" onclick="deleteAmbito('${slug}')">🗑 Elimina ambito</button>
        </div>
      </div>

      <div class="stats-bar">
        <div class="stat"><div><div class="stat-val">${docs.length}</div><div class="stat-lbl">Documenti</div></div></div>
        <div class="stat"><div><div class="stat-val">${totalPages.toLocaleString('it')}</div><div class="stat-lbl">Pagine totali</div></div></div>
        <div class="stat"><div><div class="stat-val">${fmtSize(totalSize)}</div><div class="stat-lbl">Dimensione totale</div></div></div>
      </div>

      <div class="upload-zone" id="upload-zone-${slug}"
           ondragover="event.preventDefault();this.classList.add('drag-over')"
           ondragleave="this.classList.remove('drag-over')"
           ondrop="handleDrop(event,'${slug}')">
        <input type="file" accept=".pdf" multiple onchange="uploadFiles(this.files,'${slug}');this.value=''" />
        <div class="upload-icon">📄</div>
        <h3>Trascina i PDF qui oppure clicca per selezionare</h3>
        <p>I documenti saranno indicizzati nell'ambito <strong>${escHtml(ambito.name)}</strong>.</p>
        <span class="pill-tag">Solo file PDF</span>
      </div>

      <div class="list-title">Documenti indicizzati</div>
      <div id="doc-list-${slug}">
        ${renderDocList(docs, slug)}
      </div>
    `;
  }

  function renderDocList(docs, slug) {
    if (!docs.length) {
      return `<div class="empty-state"><div class="empty-icon">📭</div><p>Nessun documento presente. Carica il primo PDF per iniziare.</p></div>`;
    }
    return docs.map(doc => `
      <div class="doc-card" id="card-${slug}-${CSS.escape(doc.filename)}">
        <div class="doc-icon">📄</div>
        <div class="doc-info">
          <div class="doc-name" title="${escHtml(doc.filename)}">${escHtml(doc.filename)}</div>
          <div class="doc-meta">
            <span>📖 ${doc.pages} ${doc.pages === 1 ? 'pagina' : 'pagine'}</span>
            <span>💾 ${fmtSize(doc.size)}</span>
          </div>
        </div>
        <div class="doc-actions">
          <button class="action-btn btn-replace" title="Sostituisci">
            <input type="file" accept=".pdf" onchange="replaceDoc('${slug}','${doc.filename.replace(/'/g,"\\'")}',this)" />
            🔄 Sostituisci
          </button>
          <button class="action-btn btn-delete" onclick="deleteDoc('${slug}','${doc.filename.replace(/'/g,"\\'")}')">
            🗑 Elimina
          </button>
        </div>
      </div>
    `).join('');
  }

  // ── Upload ───────────────────────────────────────────────────────────

  function handleDrop(event, slug) {
    event.preventDefault();
    document.getElementById(`upload-zone-${slug}`).classList.remove('drag-over');
    uploadFiles(event.dataTransfer.files, slug);
  }

  async function uploadFiles(files, slug) {
    if (!files || !files.length) return;
    const pdfs    = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.pdf'));
    const nonPdf  = Array.from(files).filter(f => !f.name.toLowerCase().endsWith('.pdf'));
    if (nonPdf.length) toast(`Solo PDF supportati: ${nonPdf.map(f=>f.name).join(', ')}`, 'error');
    if (!pdfs.length) return;

    showOverlay(`Caricamento ${pdfs.length > 1 ? pdfs.length + ' file' : '"' + pdfs[0].name + '"'}…`);

    let lastDocs = null;
    for (const file of pdfs) {
      try {
        const form = new FormData();
        form.append('file', file);
        const res  = await fetch(`${API_BASE}/docs/upload?ambito=${encodeURIComponent(slug)}`, { method: 'POST', headers: authHeaders(), body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Errore sconosciuto');
        toast(data.message, 'success');
        lastDocs = data.documents;
      } catch (err) {
        toast(`Errore caricamento "${file.name}": ${err.message}`, 'error');
      }
    }
    hideOverlay();
    if (lastDocs) document.getElementById(`doc-list-${slug}`).innerHTML = renderDocList(lastDocs, slug);
    else loadAmbitoContent(slug);
  }

  // ── Replace doc ───────────────────────────────────────────────────────

  async function replaceDoc(slug, filename, input) {
    const file = input.files[0];
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.pdf')) { toast('Solo file PDF supportati.', 'error'); return; }

    showOverlay(`Sostituzione "${filename}"…`);
    try {
      const form = new FormData();
      form.append('file', file);
      const res  = await fetch(`${API_BASE}/docs/${encodeURIComponent(filename)}?ambito=${encodeURIComponent(slug)}`, { method: 'PUT', headers: authHeaders(), body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Errore sconosciuto');
      toast(data.message, 'success');
      document.getElementById(`doc-list-${slug}`).innerHTML = renderDocList(data.documents, slug);
    } catch (err) {
      toast(`Errore sostituzione: ${err.message}`, 'error');
    } finally {
      hideOverlay();
      input.value = '';
    }
  }

  // ── Delete doc ────────────────────────────────────────────────────────

  async function deleteDoc(slug, filename) {
    if (!confirm(`Eliminare "${filename}"?\nL'operazione è irreversibile.`)) return;
    showOverlay(`Eliminazione "${filename}"…`);
    try {
      const res  = await fetch(`${API_BASE}/docs/${encodeURIComponent(filename)}?ambito=${encodeURIComponent(slug)}`, { method: 'DELETE', headers: authHeaders() });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Errore sconosciuto');
      toast(data.message, 'success');
      document.getElementById(`doc-list-${slug}`).innerHTML = renderDocList(data.documents, slug);
    } catch (err) {
      toast(`Errore eliminazione: ${err.message}`, 'error');
    } finally {
      hideOverlay();
    }
  }

  // ── Reindex ambito ────────────────────────────────────────────────────

  async function reindexAmbito(slug) {
    if (!confirm(`Ricostruire l'indice vettoriale per questo ambito?\nL'operazione può richiedere qualche minuto.`)) return;
    showOverlay('Reindicizzazione in corso…');
    try {
      const res  = await fetch(`${API_BASE}/docs/reindex?ambito=${encodeURIComponent(slug)}`, { method: 'POST', headers: authHeaders() });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Errore sconosciuto');
      toast(data.message, 'success');
      if (data.documents) document.getElementById(`doc-list-${slug}`).innerHTML = renderDocList(data.documents, slug);
    } catch (err) {
      toast(`Errore reindicizzazione: ${err.message}`, 'error');
    } finally {
      hideOverlay();
    }
  }

  // ── Delete ambito ─────────────────────────────────────────────────────

  async function deleteAmbito(slug) {
    const ambito = allAmbiti.find(a => a.slug === slug);
    if (!confirm(`Eliminare l'ambito "${ambito ? ambito.name : slug}" e tutti i suoi documenti?\nQuesta operazione è irreversibile.`)) return;

    showOverlay(`Eliminazione ambito…`);
    try {
      const res  = await fetch(`${API_BASE}/ambiti/${encodeURIComponent(slug)}`, { method: 'DELETE', headers: authHeaders() });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Errore sconosciuto');
      toast(data.message, 'success');
      activeSlug = null;
      document.getElementById('no-ambito-msg').style.display  = 'block';
      document.getElementById('ambito-content').style.display = 'none';
      await loadAmbiti();
    } catch (err) {
      toast(`Errore eliminazione ambito: ${err.message}`, 'error');
    } finally {
      hideOverlay();
    }
  }

  // ── Create ambito modal ───────────────────────────────────────────────

  function openCreateModal() {
    document.getElementById('f-name').value = '';
    document.getElementById('f-slug').value = '';
    document.getElementById('f-desc').value = '';
    document.getElementById('f-icon').value = '📂';
    chosenColor = COLORS[0];
    renderColorSwatches();
    document.getElementById('modal-overlay').classList.add('active');
    setTimeout(() => document.getElementById('f-name').focus(), 50);
  }

  function closeCreateModal() {
    document.getElementById('modal-overlay').classList.remove('active');
  }

  function renderColorSwatches() {
    document.getElementById('color-row').innerHTML = COLORS.map(c => `
      <div class="color-swatch ${c === chosenColor ? 'chosen' : ''}"
           style="background:${c}"
           onclick="pickColor('${c}')"
           title="${c}"></div>
    `).join('');
  }

  function pickColor(c) { chosenColor = c; renderColorSwatches(); }

  // Auto-slugify name
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('f-name').addEventListener('input', e => {
      document.getElementById('f-slug').value = slugify(e.target.value);
    });
    renderColorSwatches();
  });

  async function createAmbito() {
    const name = document.getElementById('f-name').value.trim();
    const slug = document.getElementById('f-slug').value.trim();
    const desc = document.getElementById('f-desc').value.trim();
    const icon = document.getElementById('f-icon').value.trim() || '📂';

    if (!name) { toast('Il nome è obbligatorio.', 'error'); return; }
    if (!slug) { toast('Lo slug è obbligatorio.', 'error'); return; }

    closeCreateModal();
    showOverlay(`Creazione ambito "${name}"…`);
    try {
      const res  = await fetch(`${API_BASE}/ambiti`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ name, slug, description: desc, color: chosenColor, icon }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Errore sconosciuto');
      toast(data.message, 'success');
      await loadAmbiti();
      selectAmbito(slug);
    } catch (err) {
      toast(`Errore creazione: ${err.message}`, 'error');
    } finally {
      hideOverlay();
    }
  }

  // Close modal on backdrop click
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeCreateModal();
  });

  // ── User info ─────────────────────────────────────────────────────────

  function renderUserInfo(user) {
    const chip = document.getElementById('user-chip');
    chip.textContent = '👤 ' + user.username;
    chip.style.display = 'flex';
    if (user.role === 'admin') {
      document.getElementById('admin-link').style.display = 'flex';
    }
  }

  // ── Init ─────────────────────────────────────────────────────────────

  (async () => {
    const user = await checkAuth();
    if (!user) return;
    if (window.helixApplyUserTheme) window.helixApplyUserTheme(user);
    renderUserInfo(user);
    loadAmbiti();
  })();
</script>

</body>
</html>
