apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helix.fullname" . }}-seed
  labels:
    {{- include "helix.labels" . | nindent 4 }}
type: Opaque
stringData:
  # users.json — contiene hash password (vedi backend/auth.py)
  users.json: |
    {{- .Values.seed.users | toPrettyJson | nindent 4 }}
  # settings_llm.json — reso dagli stessi valori di config/secrets per coerenza
  # al primo boot. Dopo l'avvio la copia su PVC (modificabile da UI admin) è autoritativa.
  settings_llm.json: |
    {{- dict
          "LLM_PROVIDER" .Values.config.llmProvider
          "GEMINI_API_KEY" .Values.secrets.geminiApiKey
          "GEMINI_MODEL" .Values.config.geminiModel
          "CLAUDE_API_KEY" .Values.secrets.claudeApiKey
          "CLAUDE_MODEL" .Values.config.claudeModel
          "INGESTION_PROVIDER" .Values.config.ingestionProvider
          "LLAMAPARSE_API_KEY" .Values.secrets.llamaparseApiKey
        | toPrettyJson | nindent 4 }}
