apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helix.chromadb.fullname" . }}
  labels:
    {{- include "helix.labels" . | nindent 4 }}
    app.kubernetes.io/component: chromadb
spec:
  replicas: 1
  strategy:
    type: Recreate   # PVC RWO: niente rolling update
  selector:
    matchLabels:
      {{- include "helix.selectorLabels" (dict "root" . "component" "chromadb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helix.selectorLabels" (dict "root" . "component" "chromadb") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: chromadb
          image: "{{ .Values.chromadb.image.repository }}:{{ .Values.chromadb.image.tag }}"
          imagePullPolicy: {{ .Values.chromadb.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: PERSIST_DIRECTORY
              value: /chroma/chroma
          livenessProbe:
            httpGet:
              path: {{ .Values.chromadb.heartbeatPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: {{ .Values.chromadb.heartbeatPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.chromadb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /chroma/chroma
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "helix.chromadb.fullname" . }}
