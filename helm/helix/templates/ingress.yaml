{{- if .Values.ingress.enabled -}}
{{- $backendSvc := include "helix.backend.fullname" . -}}
{{- $backendPort := .Values.backend.service.port -}}
{{- $frontendSvc := include "helix.frontend.fullname" . -}}
{{- $frontendPort := .Values.frontend.service.port -}}
{{- $apiPaths := list "/auth" "/chat" "/ambiti" "/docs-list" "/docs" "/admin" "/health" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "helix.fullname" . }}
  labels:
    {{- include "helix.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Path API → backend (match per-elemento: /docs non intercetta /docs.html)
          {{- range $apiPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $backendSvc }}
                port:
                  number: {{ $backendPort }}
          {{- end }}
          # Catch-all → frontend (statici)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $frontendSvc }}
                port:
                  number: {{ $frontendPort }}
{{- end }}
